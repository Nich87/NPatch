---
name: Feature request / 機能リクエスト
description: Suggest an idea. / 新機能や改善を提案する
labels: [enhancement]
title: "[Feature Request] "
body:
  - type: textarea
    attributes:
      label: Is your feature request related to a problem? / この提案は既存の問題に関係していますか？
      placeholder: A clear and concise description of what the problem is. / どんな問題があるかを簡潔に記入してください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like / 望む解決策
      placeholder: A clear and concise description of what you want to happen. / 追加してほしい機能の動作を簡潔に記入してください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context / 補足情報
      placeholder: Add any other context or screenshots about the feature request here. / その他の情報やスクリーンショットがあれば記入してください。
    validations:
      required: false
