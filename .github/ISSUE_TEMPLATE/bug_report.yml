name: Bug report / 不具合報告
description: Report errors or unexpected behavior. / エラーや想定外の動作を報告する
labels: [bug]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting issues of NPatch!

        To make it easier for us to help you please enter detailed information below.

        NPatch への報告ありがとうございます。
        調査しやすくするため、以下の項目をできるだけ具体的に記入してください。
  - type: textarea
    attributes:
      label: Steps to reproduce / 再現手順
      value: |
        1. 
        1. 
        1. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour / 期待する動作
      placeholder: Tell us what should happen. / 本来どうなるはずか
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour / 実際の動作
      placeholder: Tell us what happens instead. / 実際にどうなったか
    validations:
      required: true
  - type: textarea
    attributes:
      label: Xposed module list / Xposed モジュール一覧
      render: Shell
    validations:
      required: true
  - type: input
    attributes:
      label: NPatch version / NPatch のバージョン
      description: Don't use 'latest'. Specify the actual version with 4 digits, otherwise your issue will be closed. / 「最新版」は不可。4桁のバージョン番号を記入してください。記入が無い場合は issue を閉じます。
    validations:
      required: true
  - type: input
    attributes:
      label: Android version / Android のバージョン
    validations:
      required: true
  - type: input
    attributes:
      label: Shizuku version / Shizuku のバージョン
      description: If you are not using Shizuku mode, input `N/A` instead. / Shizuku モードを使っていない場合は `N/A` と記入してください。
    validations:
      required: true
  - type: checkboxes
    id: latest
    attributes:
      label: Version requirement / バージョン要件
      options:
        - label: I am using the latest debug CI version of NPatch and enabled verbose log. / 最新の CI デバッグビルドを使用し、詳細ログを有効にしています
          required: true
  - type: textarea
    attributes:
      label: Apk file / APK ファイル
      description: The apk file if patching failed. / パッチに失敗した APK があれば添付してください。
      placeholder: Upload apks by clicking the bar on the bottom. / 下部のバーをクリックして APK をアップロードできます。
  - type: textarea
    attributes:
      label: Logs / ログ
      description: For usage issues, please provide the log zip saved from the manager; for activation issues, please provide a [bugreport](https://developer.android.com/studio/debug/bug-report). Without log, the issue will be closed. / 使用中の問題はマネージャーから保存したログの zip を、起動・有効化の問題は [bugreport](https://developer.android.com/studio/debug/bug-report) を添付してください。ログが無い場合は issue を閉じます。
      value: |
        <details>
        
        ```
        # Replace this line with the log / この行をログで置き換えてください
        ```
        </details>
    validations:
      required: true
