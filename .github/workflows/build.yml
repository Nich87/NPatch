name: CI ビルド

on:
  workflow_dispatch:
    inputs:
      build_debug:
        description: Debug APK も生成する
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - line-manager
      - dev
      - neo
    tags:
      - 'v*'
  merge_group:

permissions:
  contents: write

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'
      CCACHE_DIR: '${{ github.workspace }}/.ccache'
      CCACHE_MAXSIZE: '2G'

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        submodules: 'false'
        fetch-depth: 0

    - name: サブモジュールと libxposed ソースの設定
      shell: bash
      run: bash scripts/prepare-libxposed-ci.sh

    - name: ccache のインストール
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache

    - name: キャッシュの設定
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: リリース署名キーを設定
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      env:
        KEY_STORE: ${{ secrets.KEY_STORE }}
        ANDROID_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        : "${KEY_STORE:?KEY_STORE is required for a signed build}"
        : "${ANDROID_STORE_PASSWORD:?KEY_STORE_PASSWORD is required}"
        : "${ANDROID_KEY_ALIAS:?ALIAS is required}"
        : "${ANDROID_KEY_PASSWORD:?KEY_PASSWORD is required}"
        umask 077
        printf '%s' "$KEY_STORE" | base64 --decode > "$RUNNER_TEMP/npatch-release.jks"
        {
          printf 'ANDROID_STORE_FILE=%s\n' "$RUNNER_TEMP/npatch-release.jks"
          printf 'ANDROID_STORE_PASSWORD=%s\n' "$ANDROID_STORE_PASSWORD"
          printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
          printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
        } >> "$GITHUB_ENV"

    - name: Java の設定
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Gradle の設定
      uses: gradle/actions/setup-gradle@v5

    - name: Android SDK の設定
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: ninja の設定
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: CMake の設定
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: Android 付属の cmake を削除
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: gradlew に実行権限を付与
      run: chmod +x gradlew

    - name: Manager の Release 単体テスト
      run: ./gradlew :manager:testReleaseUnitTest

    - name: commit id の設定
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV

    - name: Gradle でビルド
      env:
        BUILD_DEBUG: ${{ inputs.build_debug }}
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* || "$BUILD_DEBUG" == true ]]; then
          ./gradlew buildAll
        else
          ./gradlew buildRelease
        fi

    - name: 配布用 APK の署名を検証
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      run: |
        set -euo pipefail
        apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
        for apk in out/release/*.apk out/debug/*.apk; do
          [[ -f "$apk" ]] || continue
          report=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$report"
          fingerprint=$(printf '%s\n' "$report" | awk '/certificate SHA-256 digest:/ { print toupper($NF) }' | sort -u)
          # manager/build.gradle.kts の既定の署名許可リストと照合する。
          case "$fingerprint" in
            DB73788534AFFC4BFA3AE16040A2D3A2C2B63EDEA1E07F3A1CF9AFF4DD0995A8|A1F6D52645F53DB0995EDB6DD1C61071B0CA66C281C68ED20B0DEC7268E14A2C) ;;
            *) echo "::error::APK signature is not trusted by ManagerIntegrity: $apk"; exit 1 ;;
          esac
        done

    - name: ccache の統計
      if: always()
      run: ccache --show-stats

    - name: Release アーティファクトのアップロード
      uses: actions/upload-artifact@v5
      with:
        name: npatch-release-${{ env.commit }}
        path: out/release/*
        retention-days: 14

    - name: Debug アーティファクトのアップロード
      if: startsWith(github.ref, 'refs/tags/v') || inputs.build_debug == true
      uses: actions/upload-artifact@v5
      with:
        name: npatch-debug-${{ env.commit }}
        path: out/debug/*
        retention-days: 7

    - name: mappings のアップロード
      uses: actions/upload-artifact@v5
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: symbols のアップロード
      uses: actions/upload-artifact@v5
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols

    - name: GitHub リリースの作成（タグプッシュ時のみ）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/release/*.apk
          out/debug/*.apk
        generate_release_notes: true
        fail_on_unmatched_files: false

    - name: 署名キーを削除
      if: always()
      run: rm -f "$RUNNER_TEMP/npatch-release.jks"
